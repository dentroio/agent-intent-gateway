# Example intent policy for a small simulated enterprise.
version: 1
policy_version: "2026.11.1"   # tokens minted for another version are refused
default: deny

# Backend-assigned policy classes (AegisFlux WO-SEG-011). They arrive in the
# per-stream token and can only tighten decisions. Unknown classes are refused.
classes:
  development: {}
  research: { require_approval: ["finance.approve_payment", "ot.set_point"] }
  privileged: {}
  quarantine: { deny: ["*"] }

tools:
  finance.query_ledger:    { reads: [finance], args: [status] }
  finance.approve_payment: { writes: [finance], risk: high, args: [id] }
  hr.lookup_employee:      { reads: [pii], args: [id] }
  # Shared store: labels follow data written here to whoever reads it later.
  docs.search:             { reads: [internal], loads: docs, args: [q] }
  docs.write:              { writes: [internal], stores: docs, store_key: path, args: [path, content] }
  web.fetch:               { reads: [untrusted], sink: external, args: [url] }   # the URL itself leaves the building
  email.read_inbox:        { reads: [untrusted], args: [] }                      # inbound mail is attacker-controllable
  email.send:
    sink: external
    args: [to, cc, bcc, subject, body]
    egress_rules:
      # Internal only if every recipient in every field is one well-formed corp address.
      - { args: [to, cc, bcc], kind: email, pattern: "*@corp.example", sink: internal }
  ot.read_sensor:          { reads: [ot], args: [sensor] }
  ot.set_point:            { writes: [ot], risk: high, args: [line, value] }

agents:
  - id: expense-bot
    purpose: Reconcile employee expense reports against the ledger
    on_behalf_of: ["group:finance", "user:*@corp.example"]
    allow: [finance.query_ledger, docs.search, docs.write, email.send, email.read_inbox]
    require_approval: [finance.approve_payment]

  - id: research-assistant
    purpose: Answer questions using internal docs and the public web
    on_behalf_of: ["user:*@corp.example"]
    allow: [docs.search, web.fetch, email.send]
    deny: [finance.*, hr.*, ot.*]

  - id: plant-monitor
    purpose: Watch OT sensors and report anomalies to operators
    on_behalf_of: ["group:ot-operators"]
    allow: [ot.read_sensor, email.send]
    require_approval: [ot.set_point]

flows:
  # Value precision: deny when the call carries ledger values (even encoded or
  # mangled); allow when the agent has seen the ledger but sends none of it.
  # Residual risk, documented in the red team: LLM paraphrase of the data.
  - { id: no-finance-egress,  from: finance,   to: external,  action: deny, precision: value, residual: allow }
  - { id: no-pii-egress,      from: pii,       to: external,  action: deny }
  - { id: no-ot-egress,       from: ot,        to: external,  action: deny }
  - { id: internal-stays-in,  from: internal,  to: external,  action: require_approval }
  # Anything the agent read from an attacker-controllable source may not
  # silently drive a high-risk action (indirect prompt injection).
  - { id: untrusted-no-high-risk, from: untrusted, to: "risk:high", action: deny }
