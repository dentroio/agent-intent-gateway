[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-intent-gateway"
version = "0.1.0"
description = "Identity-, intent- and data-flow-aware enforcement for AI agent tool calls (MCP)"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
aig = "aig.cli:main"

[tool.setuptools]
packages = ["aig"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
